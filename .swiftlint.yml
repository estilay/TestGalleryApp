disabled_rules:
  - trailing_whitespace
  - todo
  - orphaned_doc_comment

opt_in_rules:
  - empty_count
  - empty_string
  - explicit_init

excluded:
  - Pods
  - .build
  - DerivedData

force_cast: warning
force_try: warning

line_length:
  warning: 120
  error: 200

identifier_name:
  min_length: 1
  excluded:
    - id
    - i
    - x
    - y
    
type_body_length:
  warning: 300
  error: 500

function_body_length:
  warning: 50
  error: 100
